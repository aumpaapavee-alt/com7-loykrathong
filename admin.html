<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — COM7 ลอยกระทง 2569 (Director)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Admin Panel — COM7 ลอยกระทง สานสายใจ 2569
   ผู้พัฒนา: แจ็ค (IT & Systems)
   เชื่อม backend v4 (Google Apps Script) ผ่าน JSONP (GET) + fetch (POST)
   ★ แยก config ออกจาก logic — แก้ ENDPOINT/PASS ที่เดียว
   ============================================================ */
:root{
  --navy:#0f1440; --navy-2:#080b24; --gold:#e8c874; --gold-2:#f6e2a6;
  --ink:#f4f1e6; --ok:#3fbf7f; --no:#e06a6a; --warn:#e8b04a;
  --card:#161a45; --brd:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Kanit',system-ui,sans-serif;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:var(--ink);min-height:100vh;padding:0 0 60px}
header{position:sticky;top:0;z-index:10;background:rgba(8,11,36,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--brd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.15rem;font-weight:600;color:var(--gold-2)}
header .ver{font-size:.72rem;opacity:.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px}

/* login */
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--brd);
  border-radius:18px;padding:34px 28px;text-align:center}
.login h2{color:var(--gold-2);margin-bottom:6px}
.login p{font-size:.9rem;opacity:.7;margin-bottom:20px}
input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--brd);
  background:#0d1030;color:var(--ink);font-family:inherit;font-size:1rem;margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:12px 20px;font-family:inherit;font-size:1rem;font-weight:600;
  cursor:pointer;transition:.2s;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#3a2d05}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 14px;font-size:.85rem;border-radius:8px}
.btn-ok{background:var(--ok);color:#04331d}
.btn-no{background:var(--no);color:#3a0808}
.btn-ghost{background:transparent;border:1px solid var(--brd);color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--brd);background:transparent;
  color:var(--ink);cursor:pointer;font-family:inherit;font-size:.92rem;transition:.2s}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#3a2d05;font-weight:600;border-color:transparent}

/* vote switch bar */
.votebar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.vote-status{font-size:1.05rem;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.off{background:var(--no)}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pcard{background:var(--card);border:1px solid var(--brd);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column}
.pcard .ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:#0d1030}
.pcard .body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:5px}
.pcard .nm{font-weight:600}
.pcard .meta{font-size:.82rem;opacity:.7}
.badge{display:inline-block;font-size:.74rem;padding:3px 10px;border-radius:999px;font-weight:500}
.badge.pending{background:rgba(232,176,74,.2);color:var(--warn)}
.badge.approved{background:rgba(63,191,127,.2);color:var(--ok)}
.badge.rejected{background:rgba(224,106,106,.2);color:var(--no)}
.pcard .acts{display:flex;gap:8px;margin-top:8px}
.pcard .acts .btn{flex:1}

/* results table */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--brd);font-size:.92rem}
th{background:#0d1030;color:var(--gold-2);font-weight:600}
tr:last-child td{border-bottom:0}
.rank{font-weight:700;color:var(--gold-2)}
.score{font-weight:700}

.muted{opacity:.6;text-align:center;padding:40px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222a5c;
  border:1px solid var(--brd);padding:12px 22px;border-radius:12px;z-index:50;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.section-title{font-size:1rem;font-weight:600;color:var(--gold-2);margin:24px 0 12px}
.count-pill{font-size:.8rem;background:rgba(255,255,255,.1);padding:2px 10px;border-radius:999px;margin-left:8px}
</style>
</head>
<body>

<header>
  <h1>⚙️ Admin — ลอยกระทง สานสายใจ 2569</h1>
  <span class="ver">v4 · Director</span>
</header>

<!-- Login -->
<div id="loginView" class="login">
  <h2>🔐 เข้าสู่ระบบผู้ดูแล</h2>
  <p>สำหรับ Director เท่านั้น</p>
  <input type="password" id="passInput" placeholder="รหัสผู้ดูแล" onkeydown="if(event.key==='Enter')login()" />
  <button class="btn" style="width:100%" onclick="login()">เข้าสู่ระบบ</button>
  <p id="loginErr" style="color:var(--no);margin-top:10px;display:none">รหัสไม่ถูกต้อง</p>
</div>

<!-- Main -->
<div id="mainView" class="wrap" style="display:none">
  <!-- แถบเปิด/ปิดโหวต -->
  <div class="votebar">
    <div class="vote-status"><span id="voteDot" class="dot off"></span><span id="voteText">กำลังโหลด…</span></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-sm btn-ok" onclick="setVote(true)">เปิดโหวต</button>
      <button class="btn btn-sm btn-no" onclick="setVote(false)">ปิดโหวต</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="approve" onclick="switchTab('approve')">🖼️ อนุมัติรูป</button>
    <button class="tab" data-tab="results" onclick="switchTab('results')">📊 ผลโหวต</button>
    <button class="tab btn-ghost" onclick="loadAll()" style="margin-left:auto">🔄 รีเฟรช</button>
  </div>

  <!-- Tab: อนุมัติรูป -->
  <div id="tab-approve">
    <div id="pendingWrap"></div>
    <div id="approvedWrap"></div>
  </div>

  <!-- Tab: ผลโหวต -->
  <div id="tab-results" style="display:none">
    <div class="section-title">👑 หญิง</div>
    <div id="resFemale"></div>
    <div class="section-title">👑 ชาย</div>
    <div id="resMale"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============ CONFIG (แก้ที่เดียว) ============ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxwEz2bvtds7pdesrnXzHr9gOCKhfxp0xQuQwPS0XzpZd-UQBZrAIyqcxh-8ZAaVVCI-Q/exec";  // ★ ใส่ Web App URL หลัง deploy (ลงท้าย /exec)
let ADMIN_PASS = "";                         // เก็บชั่วคราวหลัง login (ไม่ hardcode)

/* ============ JSONP helper (GET ข้าม CORS) ============ */
// SEC#4: ส่ง admin request แบบ POST (pass อยู่ใน body ไม่โผล่ใน URL/log)
async function apiPost(params){
  try{
    const r = await fetch(ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(params)
    });
    return await r.json();
  }catch(err){ return { ok:false, error:String(err && err.message || err) }; }
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_' + Date.now() + Math.floor(Math.random()*1000);
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (data)=>{ cleanup(); resolve(data); };
    const qs = Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    const s = document.createElement('script');
    s.src = ENDPOINT + '?' + qs + '&callback=' + cb;
    s.onerror = ()=>{ cleanup(); reject(new Error('network')); };
    document.body.appendChild(s);
  });
}

/* ============ Login ============ */
async function login(){
  const pass = document.getElementById('passInput').value.trim();
  if(!pass) return;
  if(ENDPOINT.indexOf('PASTE')>-1){
    toast('⚠️ ยังไม่ได้ใส่ Web App URL ในโค้ด (ENDPOINT)'); return;
  }
  try{
    const r = await apiPost({ action:'admin_list', pass:pass });
    if(r && r.ok){
      ADMIN_PASS = pass;
      document.getElementById('loginView').style.display='none';
      document.getElementById('mainView').style.display='block';
      renderContestants(r.data); renderVoteState(r.voteOpen);
      loadResults();
    }else{
      document.getElementById('loginErr').style.display='block';
    }
  }catch(e){ toast('เชื่อมต่อ backend ไม่ได้: '+e.message); }
}

/* ============ โหลดข้อมูล ============ */
async function loadAll(){
  try{
    const r = await apiPost({ action:'admin_list', pass:ADMIN_PASS });
    if(r.ok){ renderContestants(r.data); renderVoteState(r.voteOpen); }
    loadResults();
    toast('รีเฟรชแล้ว');
  }catch(e){ toast('โหลดไม่สำเร็จ: '+e.message); }
}

async function loadResults(){
  try{
    const r = await jsonp({ action:'results' });
    if(r.ok){ renderResults('resFemale', r.female); renderResults('resMale', r.male); }
  }catch(e){}
}

/* ============ Render: ผู้สมัคร ============ */
function renderContestants(data){
  const pending  = data.filter(d=>d.สถานะ==='รออนุมัติ');
  const others   = data.filter(d=>d.สถานะ!=='รออนุมัติ');

  document.getElementById('pendingWrap').innerHTML =
    '<div class="section-title">⏳ รออนุมัติ <span class="count-pill">'+pending.length+'</span></div>' +
    (pending.length ? '<div class="grid">'+pending.map(card).join('')+'</div>'
                    : '<div class="muted">ไม่มีรายการรออนุมัติ</div>');

  document.getElementById('approvedWrap').innerHTML =
    '<div class="section-title">📋 รายการอื่น <span class="count-pill">'+others.length+'</span></div>' +
    (others.length ? '<div class="grid">'+others.map(card).join('')+'</div>' : '');
}

function card(d){
  const badge = d.สถานะ==='อนุมัติ' ? 'approved' : d.สถานะ==='ปฏิเสธ' ? 'rejected' : 'pending';
  const img = d.รูป ? '<img class="ph" src="'+d.รูป+'" alt="" loading="lazy" />' : '<div class="ph"></div>';
  const acts = d.สถานะ==='รออนุมัติ'
    ? '<div class="acts"><button class="btn btn-sm btn-ok" onclick="decide(\''+d.id+'\',\'approve\')">✅ อนุมัติ</button>'
     +'<button class="btn btn-sm btn-no" onclick="decide(\''+d.id+'\',\'reject\')">❌ ปฏิเสธ</button></div>'
    : '<div class="acts"><button class="btn btn-sm btn-ghost" onclick="decide(\''+d.id+'\',\''
      +(d.สถานะ==='อนุมัติ'?'reject':'approve')+'\')">'+(d.สถานะ==='อนุมัติ'?'ซ่อน':'อนุมัติ')+'</button></div>';
  return '<div class="pcard">'+img+'<div class="body">'
    +'<span class="badge '+badge+'">'+d.สถานะ+'</span>'
    +'<div class="nm">'+esc(d.ชื่อ)+' <small style="opacity:.5">('+d.เพศ+')</small></div>'
    +'<div class="meta">'+esc(d.บริษัท)+'</div>'
    +'<div class="meta">คะแนน: '+(d.คะแนน||0)+' · '+d.id+'</div>'
    +acts+'</div></div>';
}

/* ============ อนุมัติ/ปฏิเสธ ============ */
async function decide(id, decision){
  const label = decision==='approve'?'อนุมัติ':'ปฏิเสธ/ซ่อน';
  if(!confirm('ยืนยัน'+label+'ผู้สมัคร '+id+' ?')) return;
  try{
    const r = await apiPost({ action:'admin_approve', pass:ADMIN_PASS, id:id, decision:decision });
    if(r.ok){ toast(r.message||'อัปเดตแล้ว'); loadAll(); }
    else toast('ไม่สำเร็จ: '+(r.error||''));
  }catch(e){ toast('ผิดพลาด: '+e.message); }
}

/* ============ เปิด/ปิดโหวต ============ */
function renderVoteState(open){
  document.getElementById('voteDot').className = 'dot ' + (open?'on':'off');
  document.getElementById('voteText').textContent = open ? 'โหวตเปิดอยู่ 🟢' : 'โหวตปิดอยู่ 🔴';
}
async function setVote(open){
  if(!confirm((open?'เปิด':'ปิด')+'โหวต ยืนยัน?')) return;
  try{
    const r = await apiPost({ action:'admin_votectl', pass:ADMIN_PASS, open:open });
    if(r.ok){ renderVoteState(r.voteOpen); toast(r.message); }
    else toast('ไม่สำเร็จ: '+(r.error||''));
  }catch(e){ toast('ผิดพลาด: '+e.message); }
}

/* ============ Render: ผลโหวต ============ */
function renderResults(elId, list){
  const el = document.getElementById(elId);
  if(!list || !list.length){ el.innerHTML='<div class="muted">ยังไม่มีข้อมูล</div>'; return; }
  el.innerHTML = '<table><thead><tr><th>อันดับ</th><th>ชื่อ</th><th>บริษัท</th><th style="text-align:right">คะแนน</th></tr></thead><tbody>'
    + list.map((d,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+esc(d.ชื่อ)+'</td><td>'+esc(d.บริษัท)
      +'</td><td class="score" style="text-align:right">'+d.คะแนน+'</td></tr>').join('')
    + '</tbody></table>';
}

/* ============ UI helpers ============ */
function switchTab(t){
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  document.getElementById('tab-approve').style.display = t==='approve'?'block':'none';
  document.getElementById('tab-results').style.display = t==='results'?'block':'none';
}
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
</html>
